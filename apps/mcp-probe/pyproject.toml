[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-trace-mcp-probe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.28,<2",
  "starlette>=0.45,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
mcp-probe = "mcp_probe.server:main"
mcp-probe-smoke = "mcp_probe.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]
