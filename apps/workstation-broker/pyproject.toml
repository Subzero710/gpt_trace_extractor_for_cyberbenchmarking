[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-trace-workstation-broker"
version = "3.0.0"
requires-python = ">=3.12"
dependencies = ["starlette>=0.41,<1", "uvicorn>=0.34,<1", "pillow>=11,<12"]

[project.scripts]
gpt-trace-workstation-broker = "workstation_broker.server:main"

[tool.setuptools.packages.find]
where = ["src"]
