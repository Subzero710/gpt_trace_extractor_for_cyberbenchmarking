[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-trace-kali-workstation"
version = "3.0.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "mcp>=1.28,<2", "pydantic==2.13.5", "starlette>=0.41,<1", "uvicorn>=0.34,<1", "playwright>=1.53,<2", "cloakbrowser==0.4.8", "pillow>=11,<12"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
