name: gpt-trace-extractor

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gpt_traces}
      POSTGRES_USER: ${POSTGRES_USER:-gpt_traces}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - core_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gpt_traces} -d ${POSTGRES_DB:-gpt_traces}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  storage:
    build: ./apps/storage
    environment:
      STORAGE_DATABASE_URL: ${STORAGE_DATABASE_URL:-postgresql+psycopg://gpt_traces:change-me@postgres:5432/gpt_traces}
      STORAGE_HOST: 0.0.0.0
      STORAGE_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - core_internal
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Persistent teacher browser. It is never shared with benchmark Browser containers.
  browser:
    build: ./infra/browser
    environment:
      CLOAKBROWSER_LICENSE_KEY: ${CLOAKBROWSER_LICENSE_KEY:-}
      DISPLAY: :99
      BROWSER_FINGERPRINT_SEED: ${BROWSER_FINGERPRINT_SEED:?run make init}
      BROWSER_TIMEZONE: ${BROWSER_TIMEZONE:-}
      BROWSER_LOCALE: ${BROWSER_LOCALE:-}
      BROWSER_GEOIP: ${BROWSER_GEOIP:-false}
      BROWSER_ADOPT_EXISTING_PROFILE: ${BROWSER_ADOPT_EXISTING_PROFILE:-false}
      BROWSER_CLIPBOARD_PORT: ${BROWSER_CLIPBOARD_PORT:-8765}
    volumes:
      - browser_profile:/profile
    networks:
      - core_internal
      - ui_egress
    ports:
      - "127.0.0.1:9222:9222"
      - "127.0.0.1:${BROWSER_NOVNC_PORT:-7900}:7900"
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "/usr/local/bin/browser-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # Stable MCP endpoint for ChatGPT. The runner binds it to one fresh
  # Code Workspace container for the current attempt only.
  workspace-gateway:
    build: ./apps/mcp-gateway
    container_name: ${WORKSPACE_GATEWAY_CONTAINER:-gpt-trace-workspace-gateway}
    environment:
      GATEWAY_APP_ID: code-workspace
      GATEWAY_BACKEND_PREFIX: gpt-trace-workspace-
      APP_CONTROL_TOKEN_FILE: /run/secrets/app_control_token
    secrets:
      - source: app_control_token
        target: app_control_token
        uid: "0"
        gid: "0"
        mode: 0400
    networks:
      - app_control
    ports:
      - "127.0.0.1:${APP_CODE_WORKSPACE_PORT:-8011}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Stable MCP endpoint for ChatGPT. The runner binds it to one fresh
  # Browser container for the current attempt only.
  browser-gateway:
    build: ./apps/mcp-gateway
    container_name: ${BROWSER_GATEWAY_CONTAINER:-gpt-trace-browser-gateway}
    environment:
      GATEWAY_APP_ID: browser
      GATEWAY_BACKEND_PREFIX: gpt-trace-browser-
      APP_CONTROL_TOKEN_FILE: /run/secrets/app_control_token
    secrets:
      - source: app_control_token
        target: app_control_token
        uid: "0"
        gid: "0"
        mode: 0400
    networks:
      - app_control
    ports:
      - "127.0.0.1:${APP_BROWSER_PORT:-8012}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Build-only image definitions. These services are never part of the normal
  # stack; the runner creates a new container from the image for each attempt.
  workspace-runtime-image:
    profiles: ["runtime-images"]
    build: ./apps/code-workspace
    image: ${APP_CODE_WORKSPACE_IMAGE:-gpt-trace-code-workspace:latest}
    entrypoint: ["/bin/true"]
    restart: "no"

  browser-runtime-image:
    profiles: ["runtime-images"]
    build: ./apps/browser
    image: ${APP_BROWSER_IMAGE:-gpt-trace-browser:latest}
    entrypoint: ["/bin/true"]
    restart: "no"

  runner:
    profiles: ["runner"]
    build: ./apps/runner
    environment:
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-http://storage:8080}
      BROWSER_CDP_URL: ${BROWSER_CDP_URL:-}
      BROWSER_CDP_BASE_URL: ${BROWSER_CDP_BASE_URL:-http://browser:9222}
      BROWSER_FINGERPRINT_SEED: ${BROWSER_FINGERPRINT_SEED:?run make init}
      BROWSER_TIMEZONE: ${BROWSER_TIMEZONE:-}
      BROWSER_LOCALE: ${BROWSER_LOCALE:-}
      BROWSER_GEOIP: ${BROWSER_GEOIP:-false}
      BROWSER_HUMANIZE: ${BROWSER_HUMANIZE:-true}
      BROWSER_HUMANIZE_PRESET: ${BROWSER_HUMANIZE_PRESET:-default}
      BROWSER_CLIPBOARD_URL: ${BROWSER_CLIPBOARD_URL:-http://browser:8765/clipboard}
      BROWSER_NOVNC_URL: http://localhost:${BROWSER_NOVNC_PORT:-7900}/vnc.html?autoconnect=1&resize=scale
      CHATGPT_BASE_URL: ${CHATGPT_BASE_URL:-https://chatgpt.com}
      CHATGPT_CONVERSATION_TURNS: ${CHATGPT_CONVERSATION_TURNS:-100}
      CHATGPT_EXPECTED_MODEL_SLUG: ${CHATGPT_EXPECTED_MODEL_SLUG:-gpt-5-6-thinking}
      TASKS_ROOT: ${TASKS_ROOT:-/data/tasks}
      RUNNER_STATE_ROOT: /data/state
      APP_REGISTRY_PATH: /data/apps/registry/apps.json
      APP_CONTROL_TOKEN_FILE: /run/secrets/app_control_token
      APP_CODE_WORKSPACE_UI_NAME: ${APP_CODE_WORKSPACE_UI_NAME:-Code Workspace}
      APP_CODE_WORKSPACE_MCP_URL: ${APP_CODE_WORKSPACE_MCP_URL:-http://workspace-gateway:8000/mcp}
      APP_BROWSER_UI_NAME: ${APP_BROWSER_UI_NAME:-Browser}
      APP_BROWSER_MCP_URL: ${APP_BROWSER_MCP_URL:-http://browser-gateway:8000/mcp}
      APP_GITHUB_UI_NAME: ${APP_GITHUB_UI_NAME:-}
      APP_GITHUB_MANIFEST_PATH: ${APP_GITHUB_MANIFEST_PATH:-}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      APP_CODE_WORKSPACE_IMAGE: ${APP_CODE_WORKSPACE_IMAGE:-gpt-trace-code-workspace:latest}
      APP_BROWSER_IMAGE: ${APP_BROWSER_IMAGE:-gpt-trace-browser:latest}
      WORKSPACE_GATEWAY_CONTAINER: ${WORKSPACE_GATEWAY_CONTAINER:-gpt-trace-workspace-gateway}
      BROWSER_GATEWAY_CONTAINER: ${BROWSER_GATEWAY_CONTAINER:-gpt-trace-browser-gateway}
      CLOAKBROWSER_LICENSE_KEY: ${CLOAKBROWSER_LICENSE_KEY:-}
      APP_BROWSER_FINGERPRINT_SEED: ${APP_BROWSER_FINGERPRINT_SEED:?run make init}
      APP_BROWSER_SEARCH_URL_TEMPLATE: ${APP_BROWSER_SEARCH_URL_TEMPLATE:?run make init}
      APP_BROWSER_ALLOWED_PRIVATE_HOSTS: ${APP_BROWSER_ALLOWED_PRIVATE_HOSTS:-}
      APP_BROWSER_HUMANIZE: ${APP_BROWSER_HUMANIZE:-true}
      APP_BROWSER_HUMANIZE_PRESET: ${APP_BROWSER_HUMANIZE_PRESET:-default}
      APP_BROWSER_TIMEZONE: ${APP_BROWSER_TIMEZONE:-}
      APP_BROWSER_LOCALE: ${APP_BROWSER_LOCALE:-}
      APP_BROWSER_GEOIP: ${APP_BROWSER_GEOIP:-false}
      CHATGPT_TURN_TIMEOUT_SECONDS: ${CHATGPT_TURN_TIMEOUT_SECONDS:-1800}
      CHATGPT_STREAM_START_TIMEOUT_SECONDS: ${CHATGPT_STREAM_START_TIMEOUT_SECONDS:-180}
      CHATGPT_TOOL_SELECT_TIMEOUT_SECONDS: ${CHATGPT_TOOL_SELECT_TIMEOUT_SECONDS:-20}
      CHATGPT_UPLOAD_TIMEOUT_SECONDS: ${CHATGPT_UPLOAD_TIMEOUT_SECONDS:-60}
      CHATGPT_SITE_READY_TIMEOUT_SECONDS: ${CHATGPT_SITE_READY_TIMEOUT_SECONDS:-15}
      CHATGPT_CHALLENGE_TIMEOUT_SECONDS: ${CHATGPT_CHALLENGE_TIMEOUT_SECONDS:-180}
      CHATGPT_NATURAL_SNAPSHOT_WAIT_SECONDS: ${CHATGPT_NATURAL_SNAPSHOT_WAIT_SECONDS:-0}
      RUNNER_ID: ${RUNNER_ID:-}
      RUNNER_RECOVER_EXISTING: ${RUNNER_RECOVER_EXISTING:-true}
    secrets:
      - source: app_control_token
        target: app_control_token
        uid: "0"
        gid: "0"
        mode: 0400
    volumes:
      - ./benchmarks:/data/benchmarks:ro
      - ./tasks:/data/tasks:ro
      - ./exports:/data/exports
      - ./apps:/data/apps:ro
      - runner_state:/data/state
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - core_internal
      - app_control
    depends_on:
      storage:
        condition: service_healthy
      browser:
        condition: service_healthy
      workspace-gateway:
        condition: service_healthy
      browser-gateway:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: "no"

volumes:
  postgres_data:
  browser_profile:
  runner_state:

networks:
  core_internal:
    internal: true
  app_control:
    internal: true
  ui_egress:

secrets:
  app_control_token:
    file: ./.secrets/app_control_token
