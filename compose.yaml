name: gpt-trace-extractor

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gpt_traces}
      POSTGRES_USER: ${POSTGRES_USER:-gpt_traces}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gpt_traces} -d ${POSTGRES_DB:-gpt_traces}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  storage:
    build: ./apps/storage
    environment:
      STORAGE_DATABASE_URL: ${STORAGE_DATABASE_URL:-postgresql+psycopg://gpt_traces:change-me@postgres:5432/gpt_traces}
      STORAGE_HOST: 0.0.0.0
      STORAGE_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  browser:
    build: ./infra/browser
    environment:
      CLOAKBROWSER_LICENSE_KEY: ${CLOAKBROWSER_LICENSE_KEY:-}
      DISPLAY: :99
      BROWSER_FINGERPRINT_SEED: ${BROWSER_FINGERPRINT_SEED:?set BROWSER_FINGERPRINT_SEED in .env}
    volumes:
      - browser_profile:/profile
    ports:
      - "127.0.0.1:9222:9222"
      - "127.0.0.1:${BROWSER_NOVNC_PORT:-7900}:7900"
    shm_size: "2gb"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:9222/json/version?fingerprint=$${BROWSER_FINGERPRINT_SEED}\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  runner:
    build: ./apps/runner
    environment:
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-http://storage:8080}
      BROWSER_CDP_URL: ${BROWSER_CDP_URL:-}
      BROWSER_CDP_BASE_URL: ${BROWSER_CDP_BASE_URL:-http://browser:9222}
      BROWSER_FINGERPRINT_SEED: ${BROWSER_FINGERPRINT_SEED:?set BROWSER_FINGERPRINT_SEED in .env}
      BROWSER_NOVNC_URL: http://localhost:${BROWSER_NOVNC_PORT:-7900}/vnc.html?autoconnect=1&resize=scale
      CHATGPT_BASE_URL: ${CHATGPT_BASE_URL:-https://chatgpt.com}
      CHATGPT_CONVERSATION_TURNS: ${CHATGPT_CONVERSATION_TURNS:-100}
      TASKS_ROOT: ${TASKS_ROOT:-/data/tasks}
      CHATGPT_TURN_TIMEOUT_SECONDS: ${CHATGPT_TURN_TIMEOUT_SECONDS:-1800}
      CHATGPT_STREAM_START_TIMEOUT_SECONDS: ${CHATGPT_STREAM_START_TIMEOUT_SECONDS:-180}
      CHATGPT_TOOL_SELECT_TIMEOUT_SECONDS: ${CHATGPT_TOOL_SELECT_TIMEOUT_SECONDS:-20}
      CHATGPT_UPLOAD_TIMEOUT_SECONDS: ${CHATGPT_UPLOAD_TIMEOUT_SECONDS:-60}
      CHATGPT_SITE_READY_TIMEOUT_SECONDS: ${CHATGPT_SITE_READY_TIMEOUT_SECONDS:-15}
      CHATGPT_CHALLENGE_TIMEOUT_SECONDS: ${CHATGPT_CHALLENGE_TIMEOUT_SECONDS:-180}
      CHATGPT_NATURAL_SNAPSHOT_WAIT_SECONDS: ${CHATGPT_NATURAL_SNAPSHOT_WAIT_SECONDS:-2}
      RUNNER_ID: ${RUNNER_ID:-}
      RUNNER_RECOVER_EXISTING: ${RUNNER_RECOVER_EXISTING:-true}
    volumes:
      - ./benchmarks:/data/benchmarks:ro
      - ./tasks:/data/tasks:ro
      - ./exports:/data/exports
    depends_on:
      storage:
        condition: service_healthy
      browser:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: "no"

volumes:
  postgres_data:
  browser_profile:
