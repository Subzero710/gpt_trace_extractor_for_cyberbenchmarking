name: CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover testable components
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.components.outputs.matrix }}
      docker_components: ${{ steps.components.outputs.docker_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Derive matrix from package metadata and test directories
        id: components
        run: |
          echo "matrix=$(python .github/scripts/ci_manifest.py matrix)" >> "$GITHUB_OUTPUT"
          echo "docker_matrix=$(python .github/scripts/ci_manifest.py matrix --mode docker)" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate tracked sources and configuration syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install syntax parser and test runner
        run: python -m pip install 'PyYAML>=6' 'pytest>=8.3,<9' 'ruff>=0.9,<1'
      - name: Parse tracked source and configuration files
        run: python .github/scripts/ci_manifest.py validate
      - name: Reject undefined names and invalid Python syntax
        run: python -m ruff check --select F821,F822,F823,E9 .
      - name: Test CI discovery, syntax validation and gate behavior
        run: python -m pytest -q tests/ci

  rust:
    name: Native Rust resolver unit tests and release build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Execute compiled Rust unit tests
        run: cargo test --offline --locked --manifest-path rust/verified-resolver/Cargo.toml
      - name: Verify native release binary compiles
        run: cargo build --offline --locked --release --manifest-path rust/verified-resolver/Cargo.toml

  distributed:
    name: Distributed behavioral tests
    runs-on: ubuntu-latest
    needs: rust
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build root-owned mandatory Rust solver before Python integration tests
        run: |
          cargo build --offline --locked --release --manifest-path rust/verified-resolver/Cargo.toml
          sudo chown root:root rust/verified-resolver/target/release/verified-resolver
          sudo chmod 0755 rust/verified-resolver/target/release/verified-resolver
          sudo test -x rust/verified-resolver/target/release/verified-resolver
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies in this isolated environment
        run: |
          python -m pip install -e ./shared -e './apps/workstation-broker[test]' -e './apps/runner[test]' cryptography
      - name: Exercise offline recovery, CAS, network and transport behavior
        run: |
          sudo "$(command -v python)" -m coverage run --branch --source=scripts,shared/gpt_trace_transport,apps/workstation-broker/src -m pytest -q -rs tests/distributed --ignore=tests/distributed/test_golden_resume.py
          python -m coverage report
      - name: Exercise real package acquisition and native locked interpreters
        run: GPT_TRACE_NETWORK_TESTS=1 python -m pytest -q -rs tests/distributed/test_pipeline_external.py

  golden:
    name: Golden behavioral tests with the declared guest runtime
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the guest package's declared test runtime
        run: python -m pip install -e ./shared -e './apps/kali-workstation[test]' cryptography
      - name: Exercise the complete Golden recovery and integrity suite
        run: sudo "$(command -v python)" -m pytest -q -rs tests/distributed/test_golden_resume.py

  services:
    name: Service tests (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.discover.outputs.components) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install this service's declared dependencies only
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          python -m pip install -e ./shared
          python -m pip install -e "./${COMPONENT}[test]"
      - name: Execute discovered service tests
        env:
          COMPONENT: ${{ matrix.component }}
          # Explicit collection fixture; no database is started by this job.
          POSTGRES_PASSWORD: ci-tests-only-no-database
        run: python -m pytest -q -rs "${COMPONENT}/tests"

  docker:
    name: Build service image (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.discover.outputs.docker_components) }}
    steps:
      - uses: actions/checkout@v4
      - name: Prove the Dockerfile builds without starting infrastructure
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          CONTEXT="$(python .github/scripts/ci_manifest.py docker-context --component "${COMPONENT}")"
          docker build --file "${COMPONENT}/Dockerfile" "${CONTEXT}"

  browser:
    name: Browser proxy behavioral tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install proxy test dependencies
        run: python -m pip install 'pytest>=8.3,<9' aiohttp
      - name: Exercise HTTP and WebSocket proxy behavior
        run: python -m pytest -q -rs infra/browser/tests

  gate:
    name: CI gate
    if: always()
    needs: [discover, validate, rust, distributed, golden, services, docker, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require successful completion of all prerequisite jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python .github/scripts/ci_manifest.py gate

  codeql:
    name: CodeQL (eligible repositories)
    if: >-
      ${{ github.event.repository.private == false &&
          (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v4
