name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: ${{ matrix.app }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - runner
          - storage
          - browser
          - code-workspace
          - file-relay
          - mcp-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/${{ matrix.app }}/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e "./apps/${{ matrix.app }}[test]"
      - name: Run tests
        run: python -m pytest -q -m "not integration" "apps/${{ matrix.app }}/tests"
