desktop:
  resolution:
    width: 1920
    height: 1080
  allow_resize: true
  pixel_depth: 24

network:
  protocol: http
  interface: 0.0.0.0
  websocket_port: 6902
  use_ipv4: true
  use_ipv6: false
  udp:
    public_ip: 127.0.0.1
    stun_server: none
  ssl:
    pem_certificate: /home/browser/.vnc/self.pem
    pem_key: /home/browser/.vnc/self.pem
    require_ssl: true

runtime_configuration:
  allow_client_to_override_kasm_server_settings: false

server:
  advanced:
    kasm_password_file: /home/browser/.kasmpasswd

command_line:
  prompt: false
