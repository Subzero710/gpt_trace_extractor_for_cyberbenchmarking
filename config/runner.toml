# Versioned non-secret runtime configuration.
# .env is intentionally reserved for secrets only.
[runner]
storage_base_url = "http://storage:8080"
browser_cdp_url = ""
browser_cdp_base_url = "http://teacher-browser:9222"
browser_profile_identity_path = "/browser-profile/.gpt-trace-identity"
browser_novnc_url = "http://localhost:7900/vnc.html?autoconnect=1&resize=scale"
browser_humanize = true
browser_humanize_preset = "default"
browser_clipboard_url = "http://teacher-browser:8765/clipboard"
runner_state_root = "/data/state"
app_registry_path = "/data/apps/registry/apps.json"
app_control_token_file = "/run/secrets/app_control_token"
chatgpt_base_url = "https://chatgpt.com"
chatgpt_conversation_turns = 100
chatgpt_turn_timeout_seconds = 1800.0
chatgpt_stream_start_timeout_seconds = 60.0
chatgpt_tool_select_timeout_seconds = 15.0
chatgpt_upload_timeout_seconds = 60.0
chatgpt_site_ready_timeout_seconds = 15.0
chatgpt_challenge_timeout_seconds = 180.0
chatgpt_natural_snapshot_wait_seconds = 0.0
chatgpt_expected_model_slug = "gpt-5-6-thinking"
runner_id = ""
runner_recover_existing = true

[workstation]
provider = "libvirt"
broker_socket = "/run/workstation-broker/broker.sock"
gateway_container = "gpt-trace-workstation-gateway"
boot_timeout_seconds = 120
guest_agent_timeout_seconds = 60
memory_mb = 8192
vcpus = 4
overlay_quota_gb = 16
screenshot_max_bytes = 8388608
max_terminals = 8
max_output_bytes = 1048576
max_transfer_bytes = 67108864
max_seed_bytes = 671088640
egress_allow_cidrs = []
