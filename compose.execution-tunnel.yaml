name: gpt-trace-execution-tunnel
services:
  execution-broker-tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: "${DIST_BROKER_TUNNEL_TOKEN:-}"
    user: "0:0" # Native socket has a root-owned 0700 parent; no TCP listener is published.
    volumes:
      - "${DIST_BROKER_RUNTIME_DIR:?}:/run/workstation-broker:ro"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    # Stable identity for Fossil's narrowly scoped Cloudflare/Mullvad bypass.
    mac_address: "02:42:ac:1e:fb:02"
    networks:
      tunnel_egress:
        ipv4_address: 172.30.251.2
networks:
  tunnel_egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-gpt-exec
    ipam:
      config:
        - subnet: 172.30.251.0/29
          gateway: 172.30.251.1
